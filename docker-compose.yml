
services:
  blog:
    build:
      context: .
    container_name: tech-blog-app
    expose:
      - "3000"
    restart: unless-stopped
    networks:
      - blog-network

  nginx:
    image: nginx:alpine
    container_name: tech-blog-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - blog
    restart: unless-stopped
    networks:
      - blog-network

networks:
  blog-network:
    driver: bridge
