
services:
  blog:
    build:
      context: .
    container_name: tech-blog-app
    expose:
      - "3000"
    volumes:
      - blog-data:/app/prisma/data
    environment:
      - DATABASE_URL=file:./data/blog.db
      - SESSION_SECRET=${SESSION_SECRET:-dev-secret-key-change-in-production-now!!}
      - ALIBABA_ACCESS_KEY_ID=${ALIBABA_ACCESS_KEY_ID:-}
      - ALIBABA_ACCESS_KEY_SECRET=${ALIBABA_ACCESS_KEY_SECRET:-}
      - ALIBABA_SMS_SIGN_NAME=${ALIBABA_SMS_SIGN_NAME:-}
      - ALIBABA_SMS_TEMPLATE_CODE=${ALIBABA_SMS_TEMPLATE_CODE:-}
      - ADMIN_PHONE=${ADMIN_PHONE:-15080781201}
      - SMS_MOCK=${SMS_MOCK:-true}
    restart: unless-stopped
    networks:
      - blog-network

  nginx:
    image: nginx:alpine
    container_name: tech-blog-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - blog
    restart: unless-stopped
    networks:
      - blog-network

volumes:
  blog-data:

networks:
  blog-network:
    driver: bridge
