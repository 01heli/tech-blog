name: Build and Push Docker Image

on:
  push:
    branches: [master, main]

env:
  REGISTRY: crpi-j44ew35plnwei3j6.cn-hangzhou.personal.cr.aliyuncs.com
  NAMESPACE: tech-blog

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Alibaba Cloud ACR
        run: |
          echo ">>> 登录 ${{ env.REGISTRY }}，用户名 ${{ secrets.ACR_USERNAME }}"
          echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ env.REGISTRY }} -u "${{ secrets.ACR_USERNAME }}" --password-stdin

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/tech-blog:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
