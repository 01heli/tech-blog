name: Deploy to Alibaba Cloud

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: crpi-j44ew35plnwei3j6.cn-hangzhou.personal.cr.aliyuncs.com
  NAMESPACE: tech-blog

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -e
            cd /root/tech_blog/tech-blog

            echo ">>> [$(date '+%H:%M:%S')] 拉取最新代码..."
            git fetch origin master
            git reset --hard origin/master

            echo ">>> [$(date '+%H:%M:%S')] 登录阿里云 ACR..."
            echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ env.REGISTRY }} -u "${{ secrets.ACR_USERNAME }}" --password-stdin

            echo ">>> [$(date '+%H:%M:%S')] 拉取镜像..."
            docker compose pull blog

            echo ">>> [$(date '+%H:%M:%S')] 重启服务..."
            docker compose up -d --force-recreate

            echo ">>> [$(date '+%H:%M:%S')] 清理旧镜像..."
            docker image prune -f

            echo ">>> [$(date '+%H:%M:%S')] 部署完成!"
